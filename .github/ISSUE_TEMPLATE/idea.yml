name: Idea
description: Something you'd like to see made, added or changed.
labels: [idea]
body:
  - type: dropdown
    id: studio
    attributes:
      label: Studio
      description: Which studio is this for? Pick the closest.
      options: [Design, Hardware, Software, Test, Stories, Not sure]
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What should exist, and who is it for?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it matters
      description: What problem does it solve, or what does it make better?
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Sketches, links, examples or a build link from the Lab.
