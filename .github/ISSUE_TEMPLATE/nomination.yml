name: Maker of the month
description: Nominate someone whose work or help stood out this month.
title: "Nomination: "
labels: [nomination]
body:
  - type: input
    id: who
    attributes:
      label: Who
      description: Their GitHub handle or Discord name.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: What they made or did
      description: A few lines, with links if you have them. Help given to others counts as much as work shipped.
    validations:
      required: true
